[package]
name = "pdfops"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "Fast PDF operations with JSON output for AI agents: CLI, MCP server and library"
license = "MIT"
repository = "https://github.com/KayZedd/pdfops"
readme = "README.md"
keywords = ["pdf", "mcp", "agent", "cli"]
categories = ["command-line-utilities", "text-processing"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
fontdb = "0.24.0"
getrandom = "0.4"
hayro = "0.8.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
# Must match the lopdf version pdf-extract depends on: both sides share `lopdf::Document`.
lopdf = "0.42"
pdf-extract = "0.12.1"
png = "0.18"
rayon = "1.12.0"
regex = "1.13.1"
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
subsetter = "0.2.6"
ttf-parser = "0.25"
ureq = "3.4.2"

[dev-dependencies]
lopdf = "0.42"
png = "0.18"
tempfile = "3.27.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Rendering and decompression are unusably slow unoptimised; this keeps `cargo test` fast.
[profile.dev.package."*"]
opt-level = 2
