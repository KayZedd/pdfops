[package]
name = "pdfops"
version = "0.4.1"
edition = "2024"
rust-version = "1.92"
description = "Fast PDF operations with JSON output for AI agents: CLI, MCP server and library"
license = "MIT"
repository = "https://github.com/KayZedd/pdfops"
readme = "README.md"
exclude = ["npm/", "scripts/", ".github/"]
keywords = ["pdf", "mcp", "agent", "cli"]
categories = ["command-line-utilities", "text-processing"]

# Lets `cargo binstall pdfops` fetch the release archives instead of compiling.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-{ target }{ archive-suffix }"
bin-dir = "{ name }-v{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
cms = { version = "0.2.3", features = ["builder"] }
der = "0.7"
flate2 = "1.1"
fontdb = "0.24.0"
getrandom = "0.4"
hayro = "0.8.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
lopdf = "0.45"
p12-keystore = "0.3.2"
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
png = "0.18"
pulldown-cmark = { version = "0.13.4", default-features = false }
qrcode = { version = "0.14.1", default-features = false }
rayon = "1.12.0"
regex = "1.13.1"
rsa = { version = "0.9.10", features = ["sha2"] }
rustybuzz = "0.20"
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10"
subsetter = "0.2.6"
ttf-parser = "0.25"
unicode-bidi = "0.3"
ureq = "3.4.2"
x509-cert = "0.2"

[dev-dependencies]
lopdf = "0.45"
png = "0.18"
rcgen = "0.14.10"
tempfile = "3.27.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Rendering and decompression are unusably slow unoptimised; this keeps `cargo test` fast.
[profile.dev.package."*"]
opt-level = 2
